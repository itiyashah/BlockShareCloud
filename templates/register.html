<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BlockShareCloud</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
    <style>
        .alert-success {
            color: #00f5d4;
            margin: 10px 0;
        }

        .alert-danger {
            color: #ff4d6d;
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <div class="background"></div>
    <div class="container">
        <h1>BlockShareCloud</h1>
        <h2>Create Account</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <ul style="list-style: none; padding: 0; text-align: center;">
            {% for category, message in messages %}
            <li class="alert-{{ category }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% endwith %}

        <form method="post">
            <input type="text" name="username" placeholder="Username" class="input-text" required
                style="width: 100%; margin-bottom: 15px; box-sizing: border-box;">
            <input type="password" name="password" placeholder="Password" class="input-text" required
                style="width: 100%; margin-bottom: 15px; box-sizing: border-box;">
            <input type="submit" value="Register" class="btn" style="width: 100%; background: #00b4d8;">
        </form>
        <p
            style="text-align: center; margin-top: 15px; color: #a0c4ff; font-family: 'Orbitron', sans-serif; font-size: 13px;">
            Already have an account? <a href="{{ url_for('login') }}" style="color: #00b4d8;">Login here</a></p>
    </div>
</body>

</html>
